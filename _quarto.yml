project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!en/**"

website:
  title: "Atelier de código"
  site-url: https://atelierdecodigo.com
  #margin-header: subscribe.html
  open-graph:
    site-name: "Atelier de código"
    locale: es_AR  
  navbar:
    background: "#1E2A38"
    foreground: "#FAF8F4"
    left:
      - href: index.qmd
        text: Inicio
      - href: about.qmd
        text: Acerca de
      - href: contact.qmd
        text: Contacto
      - href: posts/index.qmd
        text: Artículos
    right:
      - text: "SPA"
        href: https://atelierdecodigo.com/index.html
      - text: "ENG"
        href: https://atelierdecodigo.com/en/index.html

format:
  html:
    theme: [litera, custom.scss]
    include-in-header:
      - _includes/google-ads-head.html
      - _includes/hreflang.html
      - _includes/googletag.html
      
resources:
  - ads.txt